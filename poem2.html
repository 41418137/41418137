<body>
    <h1>烏衣巷</h1>
    
    <img src="https://fanti.dugushici.com/fcdc970042a325038021d0ee2217ad8e53a369d1/store/f5252dc5cd82f61bb4620c4f9c0df81f0fc69d33ed1bad42fce42e910756/avatar" alt="劉禹錫畫像">
    
    <p>
        朱雀橋邊野草花，烏衣巷口夕陽斜。<br>
        舊時王謝堂前燕，飛入尋常百姓家。
    </p>
